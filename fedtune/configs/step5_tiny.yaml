# Offline demo of checkpoint and resume: slow enough to interrupt with Ctrl+C after a few rounds.
experiment: { seed: 42, rounds: 12, num_clients: 6, strategy: [fedavg] }
data:
  dataset: synthetic
  max_samples: 2000
  max_length: 32
  partition: { mode: dirichlet, alpha: 1.0 }
model: { base: tiny-random, lora: { rank: 4, alpha: 8 } }
train: { local_epochs: 3, lr: 3.0e-3, batch_size: 16 }
dropout: { rate: 0.2, min_participants: 2 }
checkpoint: { every: 1, keep: 2 }
