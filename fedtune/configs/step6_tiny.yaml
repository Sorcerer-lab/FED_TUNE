# Offline check of client summaries + diversity-aware aggregation (synthetic data, tiny random model, CPU).
experiment: { seed: 42, rounds: 8, num_clients: 6, strategy: [fedavg, diversity] }
data:
  dataset: synthetic
  max_samples: 2000
  max_length: 32
  partition: { mode: dirichlet, alpha: 0.3 }
model: { base: tiny-random, lora: { rank: 4, alpha: 8 } }
train: { local_epochs: 3, lr: 3.0e-3, batch_size: 16 }
dropout: { rate: 0.2, min_participants: 2 }
diversity: { clusters: 4, beta: 1.0, gamma: 1.0, epsilon: 0.001, max_weight: null, universe: participants, gain: per_sample }
