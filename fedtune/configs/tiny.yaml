# Offline pipeline check: synthetic data + a tiny random BERT. Needs no downloads, runs on CPU in seconds.
experiment: { seed: 42, rounds: 3, num_clients: 4, strategy: [fedavg] }
data:
  dataset: synthetic
  max_samples: 2000
  max_length: 32
  partition: { mode: dirichlet, alpha: 1.0 }
model: { base: tiny-random, lora: { rank: 4, alpha: 8 } }
train: { local_epochs: 3, lr: 3.0e-3, batch_size: 16 }
dropout: { rate: 0.0, min_participants: 2 }
